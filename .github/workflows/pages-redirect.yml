name: pages-redirect

# davidcasr.com/colombia-open tenía años de links externos (LinkedIn,
# etc.) apuntando a la landing vieja, que ahora vive en
# colombia-open.github.io. Este workflow solo publica una página de
# redirect en esa URL vieja — no es la landing real, ver
# .claude/rules/releases.md y CLAUDE.md (regla 10).

on:
  push:
    branches: [main]
    paths:
      - "pages-redirect/**"
      - ".github/workflows/pages-redirect.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "pages-redirect"
      - id: deployment
        uses: actions/deploy-pages@v5
