name: pages-deploy

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - "data/registry/datasets.json"
      - ".github/workflows/pages-deploy.yml"
  # release.yml lo dispara al publicar un release: el catálogo y el roadmap de
  # la landing se generan desde el dataset_catalog.json de ese release.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generar la landing desde el último release
        # Falla fuerte si no puede leer el catálogo publicado: mejor dejar la
        # versión anterior en línea que publicar datos inventados.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/build_site.py --fetch-latest --out _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "_site"
      - id: deployment
        uses: actions/deploy-pages@v5
