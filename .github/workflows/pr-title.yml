name: PR Title

# Valida que el título de la PR siga Conventional Commits. Con squash merge,
# el título es el commit que queda en main (ver .github/CONTRIBUTING.md).
#
# Usa `pull_request` (no `pull_request_target`) y no hace checkout: no
# necesita secretos ni permisos de escritura, así que es seguro en PRs de forks.
# El título se pasa por variable de entorno, nunca interpolado en el script,
# para evitar inyección de comandos.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validar formato del título
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|test|refactor|perf|style|ci|build|chore|revert)(\([a-z0-9_./-]+\))?!?: [^ ].*'
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "OK: $TITLE"
          else
            echo "::error::El título de la PR no sigue Conventional Commits: \"$TITLE\""
            echo "Formato: <tipo>(<alcance opcional>): <descripción>"
            echo "Tipos: feat, fix, docs, test, refactor, perf, style, ci, build, chore, revert"
            echo "Ejemplo: feat: agregar calidad_aire (contaminantes ICA por estación, IDEAM)"
            echo "Ver .github/CONTRIBUTING.md"
            exit 1
          fi
