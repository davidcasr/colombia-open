[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colombia-open"
version = "0.10.0"
description = "Datasets públicos de Colombia, curados, normalizados y validados — sin lidiar con los portales/APIs/Excel de cada institución oficial."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "David Castro", email = "david.castroruiz@gmail.com" },
]
keywords = ["colombia", "open-data", "datos-abiertos", "dane", "divipola"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Instalación mínima (consumidor): solo lo necesario para LEER datos ya publicados.
dependencies = [
    "polars>=1.9,<2",
    "pyarrow>=23.0.1,<25",
    "requests>=2.32,<3",
    "platformdirs>=4.3,<5",
]

[project.urls]
Homepage = "https://github.com/davidcasr/colombia-open"
Repository = "https://github.com/davidcasr/colombia-open"
Issues = "https://github.com/davidcasr/colombia-open/issues"

[project.scripts]
colombia-open = "colombia_open.cli:main"

[project.optional-dependencies]
# Todo lo necesario para correr el pipeline extract -> build -> validate localmente.
pipeline = [
    "duckdb>=1.1,<2",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "tenacity>=9,<10",
    "structlog>=24.4,<25",
]
# Fuentes que requieren scraping real (no API/descarga directa) viven aparte:
# entorno efímero en CI, para no mezclar deps de scraping con las del
# pipeline estable.
scraping = [
    "curl_cffi>=0.7,<1",
    "beautifulsoup4>=4.12,<5",
    "defusedxml>=0.7,<1",
]
# Lookups geoespaciales (polígonos MGN) y lectura de extractos OSM (.osm.pbf,
# vía pyosmium) para infraestructura_poi. Sin este extra, correr esos
# extractores levanta ImportError explicando qué instalar.
geo = [
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    "pyarrow>=23.0.1,<25",
    "osmium>=4.0,<5",
]
# Validación de esquema estricta vía Frictionless Data Package.
validation = [
    "frictionless>=5.18,<6",
]
# Servidor MCP opcional para que agentes de IA consulten el catálogo.
mcp = [
    "mcp>=1.2,<2",
]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "mypy>=1.13,<2",
    "ruff>=0.7,<1",
    "bandit>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pre-commit>=4,<5",
    "colombia-open[pipeline,geo,validation]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/colombia_open"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["colombia_open"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra --strict-markers"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.coverage.run]
source = ["src/colombia_open"]
omit = ["*/tests/*"]
